services:
  redpanda:
    image: redpandadata/redpanda:v24.1.8
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr redpanda:9092 --set redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 5s
      timeout: 3s
      retries: 20
  scorer:
    build: .
    command: python -m src.stream
    depends_on:
      redpanda:
        condition: service_healthy
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8001:8000"]
